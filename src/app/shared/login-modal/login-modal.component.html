<div class="lmodal" *ngIf="isOpen" (click)="onBackdrop($event)">
    <div class="lmodal__panel" role="dialog" aria-modal="true" aria-label="Login">
        <button class="lmodal__close" type="button" (click)="close()" aria-label="Close">&times;</button>

        <img class="lmodal__logo" src="assets/cmn/logo-white.png" alt="OneInsure">

        <!-- Step 1: mobile number -->
        <form *ngIf="step === 'mobile'" (ngSubmit)="sendOtp()" novalidate>
            <h3 class="lmodal__title">Login to your account</h3>
            <p class="lmodal__sub">Enter your mobile number to receive a one-time password.</p>

            <label class="lmodal__label" for="loginMobile">Mobile number</label>
            <div class="lmodal__phone" [class.has-error]="error">
                <span class="lmodal__cc">+91</span>
                <input id="loginMobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel-national"
                    maxlength="10" placeholder="10-digit mobile number" [ngModel]="mobile"
                    (ngModelChange)="onDigits('mobile', $event)" autofocus>
            </div>

            <p class="lmodal__error" *ngIf="error">{{ error }}</p>

            <button class="btn btn--blue lmodal__submit" type="submit" [disabled]="!mobileValid || loading">
                {{ loading ? 'Sending OTP…' : 'Get OTP' }}
            </button>
        </form>

        <!-- Step 2: OTP -->
        <form *ngIf="step === 'otp'" (ngSubmit)="verifyOtp()" novalidate>
            <h3 class="lmodal__title">Verify OTP</h3>
            <p class="lmodal__sub">
                We've sent a 6-digit OTP to <strong>+91 {{ mobile }}</strong>
                <button class="lmodal__link" type="button" (click)="changeNumber()">Change</button>
            </p>

            <label class="lmodal__label" for="loginOtp">Enter OTP</label>
            <input #otpInput id="loginOtp" name="otp" class="lmodal__otp" [class.has-error]="error" type="text"
                inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------" [ngModel]="otp"
                (ngModelChange)="onDigits('otp', $event)">

            <p class="lmodal__error" *ngIf="error">{{ error }}</p>

            <button class="btn btn--blue lmodal__submit" type="submit" [disabled]="!otpValid || loading">
                {{ loading ? 'Verifying…' : 'Verify & Login' }}
            </button>

            <p class="lmodal__resend">
                Didn't receive it?
                <button class="lmodal__link" type="button" (click)="resendOtp()" [disabled]="resendIn > 0 || loading">
                    {{ resendIn > 0 ? 'Resend in ' + resendIn + 's' : 'Resend OTP' }}
                </button>
            </p>
        </form>
    </div>
</div>
